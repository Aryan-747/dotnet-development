<div class="auth-page auth-surface-page">
  <div class="auth-card auth-card-modern">
    <div class="auth-copy">
      <div class="brand">
        <img src="/assets/logo.svg" alt="ShopSphere" class="auth-logo" />
      </div>

      <ul class="features">
        <li>Fast product publishing workflow</li>
        <li>Role-based access for teams</li>
        <li>Activity reporting & alerts</li>
      </ul>
    </div>

    <form class="auth-form auth-form-modern" (ngSubmit)="onSubmit()">
      <div class="form-header">
        <h2>Welcome back</h2>
        <p class="muted">Sign in to continue to the management console</p>
      </div>

      <label class="field">
        <span class="label-text">Email</span>
        <input
          [(ngModel)]="form.email"
          name="email"
          type="email"
          required
          placeholder="you@company.com"
          autocomplete="username"
        />
      </label>

      <label class="field">
        <span class="label-text">Password</span>
        <input
          [(ngModel)]="form.password"
          name="password"
          type="password"
          required
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </label>

      <div class="form-meta">
        <label class="remember">
          <input type="checkbox" /> Remember me
        </label>
        <a class="muted" routerLink="/auth/forgot">Forgot?</a>
      </div>

      @if (error) {
        <p class="banner error">{{ error }}</p>
      }

      <button type="submit" class="action-button action-button-primary" [disabled]="submitting">
        {{ submitting ? 'Signing in...' : 'Sign in' }}
      </button>

      <div class="divider"><span>or continue with</span></div>

      <div class="socials">
        <div #googleButtonRef class="google-btn"></div>
      </div>

      <p class="muted footnote">
        Need a new account? <a routerLink="/auth/signup">Create one</a>
      </p>
    </form>
  </div>
</div>

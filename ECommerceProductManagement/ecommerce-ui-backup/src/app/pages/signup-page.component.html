<div class="auth-page auth-surface-page">
  <div class="auth-card auth-card-modern">
    <div class="auth-copy">
      <div class="brand">
        <img src="/assets/logo.svg" alt="ShopSphere" class="auth-logo" />
      </div>

      <p class="muted">Customer accounts can browse, sign in with Google, and use preview cart features.</p>
    </div>

    <form class="auth-form auth-form-modern" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <label class="field">
          <span class="label-text">Full name</span>
          <input [(ngModel)]="form.name" name="name" required placeholder="Your full name" />
        </label>

        <label class="field">
          <span class="label-text">Email</span>
          <input [(ngModel)]="form.email" name="email" type="email" required placeholder="you@company.com" />
        </label>

        <label class="field">
          <span class="label-text">Role</span>
          <select [(ngModel)]="form.role" name="role">
            <option value="Customer">Customer</option>
            <option value="Admin">Admin</option>
            <option value="ProductManager">Product Manager</option>
            <option value="ContentExecutive">Content Executive</option>
          </select>
        </label>

        <label class="field">
          <span class="label-text">Password</span>
          <input [(ngModel)]="form.password" name="password" type="password" required placeholder="Create a password" />
        </label>

        <label class="field">
          <span class="label-text">Confirm password</span>
          <input [(ngModel)]="form.confirmPassword" name="confirmPassword" type="password" required placeholder="Repeat password" />
        </label>
      </div>

      @if (message) {
        <p class="banner success">{{ message }}</p>
      }
      @if (error) {
        <p class="banner error">{{ error }}</p>
      }

      <button type="submit" class="action-button action-button-primary" [disabled]="submitting">
        {{ submitting ? 'Creating...' : 'Create account' }}
      </button>

      <p class="muted">
        Already have access? <a routerLink="/auth/login">Go to login</a>
      </p>
    </form>
  </div>
</div>

<div class="auth-page auth-surface-page">
  <div class="auth-card auth-card-modern">
    <div class="auth-copy">
      <div class="brand">
        <img src="/assets/logo.svg" alt="ShopSphere" class="auth-logo" />
      </div>

      <ul class="features">
        <li>Secure your account</li>
        <li>Easy password recovery</li>
        <li>Protect your data</li>
      </ul>
    </div>

    <form class="auth-form auth-form-modern" (ngSubmit)="step === 'email' ? onSubmitEmail() : onSubmitReset()">
      <div class="form-header">
        <h2>Reset Password</h2>
        <p class="muted">Enter your email to receive a password reset code</p>
      </div>

      @if (step === 'email') {
        <label class="field">
          <span class="label-text">Email</span>
          <input
            [(ngModel)]="form.email"
            name="email"
            type="email"
            required
            placeholder="you@company.com"
          />
        </label>
      } @else {
        <label class="field">
          <span class="label-text">Reset Code</span>
          <input
            [(ngModel)]="form.otpCode"
            name="otpCode"
            type="text"
            required
            placeholder="6-digit code"
          />
        </label>

        <label class="field">
          <span class="label-text">New Password</span>
          <input
            [(ngModel)]="form.newPassword"
            name="newPassword"
            type="password"
            required
            placeholder="••••••••"
          />
        </label>
      }

      @if (error) {
        <p class="banner error">{{ error }}</p>
      }
      @if (success) {
        <p class="banner success" style="color: #00C9A7; font-weight: 500;">{{ success }}</p>
      }

      <button type="submit" class="action-button action-button-primary" [disabled]="submitting">
        @if (step === 'email') {
          {{ submitting ? 'Sending...' : 'Send Reset Code' }}
        } @else {
          {{ submitting ? 'Resetting...' : 'Confirm Reset' }}
        }
      </button>

      <div class="divider"><span>or</span></div>

      <p class="muted footnote">
        Remembered your password? <a routerLink="/auth/login">Back to Sign In</a>
      </p>
    </form>
  </div>
</div>
